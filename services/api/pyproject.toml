[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexora-api"
version = "0.1.0"
description = "FastAPI backend for NEXORA"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic-settings>=2.6.1",
  "sqlalchemy>=2.0.36",
  "psycopg[binary]>=3.2.3",
  "redis>=5.2.0",
  "celery>=5.4.0",
  "httpx>=0.27.2",
  "anthropic>=2.1.0",
  "google-genai>=2.32.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.3.3", "ruff>=0.8.0", "mypy>=1.13.0"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
