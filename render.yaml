# Render blueprint for the NEXORA API. The web app is deployed separately on Vercel.
# Secrets (sync: false) are entered in the Render dashboard, never committed.
services:
  - type: web
    name: nexora-api
    runtime: python
    rootDir: services/api
    plan: free
    buildCommand: pip install .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: APP_ENV
        value: production
      - key: DATABASE_URL        # Neon connection string
        sync: false
      - key: API_CORS_ORIGINS    # your Vercel URL, e.g. https://nexora.vercel.app
        sync: false
      - key: AI_PROVIDER
        value: mock
      - key: SUPPORT_INBOX
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM_ADDRESS   # noreply@your-verified-domain
        sync: false
