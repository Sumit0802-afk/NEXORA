services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: houseplan
      POSTGRES_USER: houseplan
      POSTGRES_PASSWORD: houseplan_dev
    ports:
      - "5432:5432"
    volumes:
      - houseplan_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U houseplan -d houseplan"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - houseplan_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  houseplan_pgdata:
  houseplan_redisdata:
